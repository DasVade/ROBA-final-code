<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">ROBA system architecture</title><desc id="desc">Operator to master over UDP, sensor slave to master over UART, Vive inputs to master, and master to motors and servo.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#2a4d9b" stroke-width="1.5"/></marker></defs><rect width="960" height="410" fill="white"/><rect x="20" y="65" width="230" height="100" rx="10" fill="#eef3fb" stroke="#9aaccc"/><text x="135.0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#2a4d9b">Gamepad + Python</text><text x="135.0" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#444">Laptop driver station</text><rect x="365" y="65" width="230" height="100" rx="10" fill="#eef3fb" stroke="#9aaccc"/><text x="480.0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#2a4d9b">ESP32 FeatherS2</text><text x="480.0" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#444">Modes + motor control</text><rect x="710" y="65" width="230" height="100" rx="10" fill="#eef3fb" stroke="#9aaccc"/><text x="825.0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#2a4d9b">Motors + servo</text><text x="825.0" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#444">Differential drive / sweep</text><rect x="365" y="285" width="230" height="90" rx="10" fill="#eef3fb" stroke="#9aaccc"/><text x="480.0" y="323" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#2a4d9b">ESP32-C3 slave</text><text x="480.0" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#444">Range acquisition</text><rect x="20" y="285" width="230" height="90" rx="10" fill="#eef3fb" stroke="#9aaccc"/><text x="135.0" y="323" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#2a4d9b">Ultrasonic + ToF</text><text x="135.0" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#444">Right-back / right-front / front</text><rect x="710" y="285" width="230" height="90" rx="10" fill="#eef3fb" stroke="#9aaccc"/><text x="825.0" y="323" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#2a4d9b">Two Vive receivers</text><text x="825.0" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#444">Position + heading inputs</text><path d="M250 115H365" fill="none" stroke="#2a4d9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M595 115H710" fill="none" stroke="#2a4d9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 285V165" fill="none" stroke="#2a4d9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M250 330H365" fill="none" stroke="#2a4d9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 285V225H560V165" fill="none" stroke="#2a4d9b" stroke-width="2" marker-end="url(#arrow)"/><text x="307" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#444">Wi-Fi / UDP</text><text x="650" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#444">PWM / direction</text><text x="545" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#444">UART 115200</text><text x="305" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#444">Range I/O</text><text x="785" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#444">Optical pulse inputs</text></svg>